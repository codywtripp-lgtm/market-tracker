name: Backtest signals

# Tests early-warning signals against the full history; results are uploaded as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [signals]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas tabulate
      - run: python scripts/backtest_signals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: backtest_output/
