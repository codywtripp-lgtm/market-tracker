name: Daily USDA fetch

on:
  schedule:
    # 23:30 UTC Mon-Sat (evening US time, after terminal and beef PM reports publish)
    - cron: "30 23 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch last 10 days (re-fetch catches late reports and corrections)
        run: python -m pipeline.run
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
      - name: Update CPI (inflation adjustment)
        run: python -m pipeline.cpi
      - name: Build export files (Tableau / website)
        run: python -m pipeline.export
      - name: Check early-warning alerts
        run: python -m pipeline.alerts
      - name: Forecast next 1-4 weeks
        run: python -m pipeline.forecast || echo "Forecast failed; keeping yesterday's"
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data: daily USDA fetch $(date -u +%F)"
            git pull --rebase
            git push
          fi
