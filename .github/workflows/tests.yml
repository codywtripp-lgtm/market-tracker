name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Real fetch of the last few days against USDA; results are uploaded, not committed.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
      - run: python -m pipeline.cpi
      - run: python -m pipeline.export
      - run: python -m pipeline.volumes
      - run: python -m pipeline.alerts
      - run: python -m pipeline.forecast
      - run: python -m pipeline.track_record
      - name: USDA supply and demand calls are being kept
        run: |
          python - <<'EOF'
          import csv, datetime as dt, glob
          f = sorted(glob.glob("data/raw/shipping_point/*/*.csv"))[-1]
          rows = list(csv.DictReader(open(f, encoding="utf-8")))
          got = [r for r in rows if r.get("supply_tone")]
          print(f"{f}: {len(got)} of {len(rows)} shipping-point rows have a supply call", {r["supply_tone"] for r in got[:200]})
          EOF
      - run: python -m pipeline.board
      - run: python scripts/build_site.py
      - run: python scripts/og_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-data
          path: |
            data/export/
            data/board/
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
