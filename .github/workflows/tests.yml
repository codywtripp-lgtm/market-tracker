name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Real fetch of the last few days against USDA; results are uploaded, not committed.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
      - run: python -m pipeline.cpi
      - run: python -m pipeline.export
      - run: python -m pipeline.weather
      - run: python -m pipeline.volumes
      - run: python -m pipeline.alerts
      - run: python -m pipeline.forecast
      - run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-data
          path: |
            data/export/
            data/raw/weather/
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
