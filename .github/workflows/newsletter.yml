name: Weekly email

# Saturday morning: build this week's best-buys email from the grocery data and schedule it in Kit
# (pipeline/newsletter.py). Sends once per grocery week. Needs the KIT_API_KEY secret; without it, it only writes a
# preview. Run it by hand from the Actions tab to send a test week.
on:
  schedule:
    - cron: "0 13 * * 6"   # Saturdays 13:00 UTC (9 a.m. New York in summer, 8 a.m. in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build and schedule the email
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python -m pipeline.newsletter
      - name: Remember the week sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletter
          git diff --cached --quiet || { git commit -q -m "Weekly email sent"; git pull -q --rebase && git push -q; }
