name: Website

# Rebuilds the site after each data update. (Data commits made by other workflows
# don't trigger push events, hence workflow_run.)
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", "pipeline/**", "data/board/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Daily USDA fetch", "Backfill history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            site
            scripts
            pipeline
            data/export
            data/board
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - name: Link preview images
        run: python scripts/og_images.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # Tell Bing (and Yandex, Seznam, Naver) the pages changed, so they recrawl today instead of whenever.
    # Bing also feeds ChatGPT search and DuckDuckGo. No account needed: the key file on the site proves ownership.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow with every page in the sitemap
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request
          site, key = "https://producepricetracker.com/", "065d7c9fc8c4a3edc5b711823b7a47c8"
          time.sleep(30)  # let the new deploy settle so the key file and sitemap are live
          urls = re.findall(r"<loc>(.*?)</loc>", urllib.request.urlopen(site + "sitemap.xml").read().decode())
          body = json.dumps({"host": "producepricetracker.com", "key": key, "keyLocation": f"{site}{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print(len(urls), "urls, IndexNow status", urllib.request.urlopen(req).status)
          EOF
