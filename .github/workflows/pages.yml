name: Website

# Rebuilds the site after each data update. (Data commits made by other workflows
# don't trigger push events, hence workflow_run.)
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Daily USDA fetch", "Backfill history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            site
            scripts
            data/export
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
