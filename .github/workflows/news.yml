name: News history

# Fills data/raw/news with daily news counts per grocery topic from GDELT (pipeline/news.py), a few requests per
# run so GDELT's rate limit isn't tripped. Once the history is complete, each run just tops up the last days.
on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch a batch
        run: python -m pipeline.news 15
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/news
          git diff --cached --quiet || { git commit -q -m "News counts"; git pull -q --rebase && git push -q; }
